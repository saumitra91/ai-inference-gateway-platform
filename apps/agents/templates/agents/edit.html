{% extends "base.html" %}
{% block title %}Edit {{ agent.name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Edit Agent</h1>
  <p class="muted">Update configuration for <strong>{{ agent.name }}</strong>.</p>
</div>

<div class="grid">
  <div class="card span-2">
    <form id="edit-form" style="display:grid;gap:14px;">
      {% csrf_token %}

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Name</label>
        <input class="input" name="name" required value="{{ agent.name }}" placeholder="e.g. AI Infrastructure Monitor">
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Type</label>
        <select class="input" name="type">
          <option value="market_research" {% if agent.type == "market_research" %}selected{% endif %}>Market Research</option>
          <option value="job_discovery" {% if agent.type == "job_discovery" %}selected{% endif %}>Job Discovery</option>
        </select>
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Instructions</label>
        <textarea class="input" name="instructions" rows="4" placeholder="Describe what this agent should look for...">{{ agent.instructions }}</textarea>
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Search Query (optional)</label>
        <input class="input" name="search_query" value="{{ agent.search_query }}" placeholder="e.g. AI infrastructure, MLOps">
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Sources</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <label><input type="checkbox" name="sources" value="hackernews" {% if "hackernews" in agent.sources %}checked{% endif %}> Hacker News</label>
          <label><input type="checkbox" name="sources" value="reddit" {% if "reddit" in agent.sources %}checked{% endif %}> Reddit</label>
          <label><input type="checkbox" name="sources" value="arxiv" {% if "arxiv" in agent.sources %}checked{% endif %}> arXiv</label>
          <label><input type="checkbox" name="sources" value="github_trending" {% if "github_trending" in agent.sources %}checked{% endif %}> GitHub Trending</label>
          <label><input type="checkbox" name="sources" value="remoteok" {% if "remoteok" in agent.sources %}checked{% endif %}> RemoteOK</label>
          <label><input type="checkbox" name="sources" value="yc_jobs" {% if "yc_jobs" in agent.sources %}checked{% endif %}> YC Jobs</label>
          <label><input type="checkbox" name="sources" value="greenhouse" {% if "greenhouse" in agent.sources %}checked{% endif %}> Greenhouse</label>
          <label><input type="checkbox" name="sources" value="lever" {% if "lever" in agent.sources %}checked{% endif %}> Lever</label>
          <label><input type="checkbox" name="sources" value="rss" {% if "rss" in agent.sources %}checked{% endif %}> RSS Feeds</label>
        </div>
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Max Results</label>
        <input class="input" name="max_results" type="number" value="{{ agent.max_results }}" min="1" max="100">
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">LLM Backend</label>
        <select class="input" name="llm_backend_preference">
          <option value="llamacpp" {% if agent.llm_backend_preference == "llamacpp" %}selected{% endif %}>llama.cpp</option>
          <option value="vllm" {% if agent.llm_backend_preference == "vllm" %}selected{% endif %}>vLLM</option>
        </select>
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Schedule (cron, optional)</label>
        <input class="input" name="schedule_cron" value="{{ agent.schedule_cron }}" placeholder="e.g. 0 8 * * 1 (Mondays 8 AM)">
      </div>

      <div class="field" style="display:grid;gap:6px;">
        <label class="muted small">Digest Frequency</label>
        <select class="input" name="digest_frequency">
          <option value="disabled" {% if agent.digest_frequency == "disabled" %}selected{% endif %}>Disabled</option>
          <option value="real_time" {% if agent.digest_frequency == "real_time" %}selected{% endif %}>Real Time</option>
          <option value="daily" {% if agent.digest_frequency == "daily" %}selected{% endif %}>Daily</option>
          <option value="weekly" {% if agent.digest_frequency == "weekly" %}selected{% endif %}>Weekly</option>
        </select>
      </div>

      <div class="row">
        <button class="btn primary" type="submit">Save Changes</button>
        <a class="btn" href="{% url 'agents:detail' agent_id=agent.id %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('edit-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const sources = [...form.querySelectorAll('[name="sources"]:checked')].map(cb => cb.value);
  const body = JSON.stringify({
    name: form.querySelector('[name="name"]').value,
    type: form.querySelector('[name="type"]').value,
    instructions: form.querySelector('[name="instructions"]').value,
    search_query: form.querySelector('[name="search_query"]').value,
    sources: sources,
    max_results: parseInt(form.querySelector('[name="max_results"]').value),
    llm_backend_preference: form.querySelector('[name="llm_backend_preference"]').value,
    schedule_cron: form.querySelector('[name="schedule_cron"]').value,
    digest_frequency: form.querySelector('[name="digest_frequency"]').value,
  });
  const resp = await fetch('{% url "agents:edit" agent_id=agent.id %}', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
    body: body,
  });
  if (resp.ok) {
    window.location.href = '{% url "agents:detail" agent_id=agent.id %}';
  } else {
    const err = await resp.json();
    alert('Error: ' + (err.error || 'Unknown'));
  }
});
</script>
{% endblock %}
