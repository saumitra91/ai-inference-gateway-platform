global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ["django:8000"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8081"]
