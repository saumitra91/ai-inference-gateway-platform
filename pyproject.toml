[project]
name = "llm-inference-platform"
version = "0.1.0"
description = "Production-oriented local LLM inference control plane (Django + llama.cpp)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6",
    "djangorestframework>=3.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.20.0",
    "gunicorn>=22.0.0",
    "uvicorn[standard]>=0.29.0",
    "whitenoise>=6.6.0",
    "django-cors-headers>=4.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
