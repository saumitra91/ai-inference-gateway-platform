services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  llamacpp:
    build:
      context: ./deploy/llamacpp
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_RELEASE: b9106
    image: local/llamacpp:b9106
    environment:
      MODEL_PATH: /models/model.gguf
      CONTEXT_SIZE: "4096"
      # NUM_THREADS: set to "auto" to detect at runtime, or pin explicitly.
      # Rule of thumb: pin to (physical_cores - 1) for best throughput on a
      # shared machine; overcommitting threads causes context-switch thrash.
      NUM_THREADS: "auto"
      HOST: "0.0.0.0"
      PORT: "8080"
      # EXTRA_ARGS: space-separated additional flags, e.g. "--no-mmap --flash-attn"
      EXTRA_ARGS: ""
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  gateway:
    build:
      context: ./deploy/gateway
      dockerfile: Dockerfile
    image: local/inference-gateway:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      UPSTREAM_LLAMA_URL: http://llamacpp:8080
      SECRET_KEY: ${SECRET_KEY:-unsafe-development-secret-key}
      API_KEY_HMAC_PEPPER: ${API_KEY_HMAC_PEPPER:-}
      GATEWAY_PERSIST_LOGS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llamacpp:
        condition: service_healthy
    expose:
      - "8081"
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 25s

  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      LLAMA_CPP_BASE_URL: http://llamacpp:8080
      READINESS_INCLUDE_LLAMA: "true"
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 1"
    volumes:
      - .:/app:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llamacpp:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8888:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      django:
        condition: service_healthy
      gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      django:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
