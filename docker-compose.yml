services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  llamacpp:
    build:
      context: ./deploy/llamacpp
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_RELEASE: b9106
    image: local/llamacpp:b9106
    environment:
      MODEL_PATH: /models/model.gguf
      CONTEXT_SIZE: "4096"
      # NUM_THREADS: set to "auto" to detect at runtime, or pin explicitly.
      # Rule of thumb: pin to (physical_cores - 1) for best throughput on a
      # shared machine; overcommitting threads causes context-switch thrash.
      NUM_THREADS: "auto"
      HOST: "0.0.0.0"
      PORT: "8080"
      # EXTRA_ARGS: space-separated additional flags, e.g. "--no-mmap --flash-attn"
      # --parallel: llama.cpp parallel slots.  Must match inference_max_concurrency.
      #   Each slot consumes ctx-size / parallel tokens of KV cache.  At 8192 ctx / 4 slots,
      #   each slot gets 2048 tokens ÷ ~450 MB per 4096 tokens of KV (3B model) = ~900 MB × 4 = 3.6 GB.
      #   --ctx-size 8192 gives enough headroom for RAG prompts (~1500 tokens per request).
      #   KV cache math: 820 MB per 4096-token slot for a 3B model.  4 slots × ~820 MB × (8192/4096) = ~6.6 GB.
      # --batch-size / --ubatch-size: prompt-token batch for the prefill phase
      #   Larger = faster prompt processing for concurrent requests
      EXTRA_ARGS: "--parallel 4 --batch-size 1024 --ubatch-size 512 --ctx-size 8192"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: 12g
    restart: unless-stopped

  vllm:
    build:
      context: ./deploy/vllm
      dockerfile: Dockerfile
    image: local/vllm:latest
    env_file:
      - path: .env
        required: false
    environment:
      VLLM_MODEL_PATH: /vllm-model
      VLLM_DEVICE: cuda
      VLLM_HOST: "0.0.0.0"
      VLLM_PORT: "8000"
      VLLM_DTYPE: ${VLLM_DTYPE:-auto}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-4096}
      VLLM_GPU_MEMORY_UTIL: ${VLLM_GPU_MEMORY_UTIL:-0.90}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:---max-num-seqs 256 --enable-chunked-prefill}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    mem_limit: ${VLLM_MEM_LIMIT:-8g}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    build:
      context: ./deploy/gateway
      dockerfile: Dockerfile
    image: local/inference-gateway:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      UPSTREAM_LLAMA_URL: http://llamacpp:8080
      UPSTREAM_VLLM_URL: http://vllm:8000
      DEFAULT_BACKEND: ${DEFAULT_BACKEND:-llamacpp}
      SECRET_KEY: ${SECRET_KEY:-unsafe-development-secret-key}
      API_KEY_HMAC_PEPPER: ${API_KEY_HMAC_PEPPER:-}
      GATEWAY_PERSIST_LOGS: "true"
      INFERENCE_MAX_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 25s
    mem_limit: 2g
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      LLAMA_CPP_BASE_URL: http://llamacpp:8080
      READINESS_INCLUDE_LLAMA: "true"
      CSRF_TRUSTED_ORIGINS: http://localhost:8888,http://127.0.0.1:8888
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 1 --timeout-graceful-shutdown 60"
    volumes:
      - .:/app:rw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llamacpp:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8888:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 256m
    depends_on:
      django:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      django:
        condition: service_started

  chromadb:
    image: chromadb/chroma:0.6.3
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      ALLOW_RESET: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/chroma/data
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 1g

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  prometheus_data:
  grafana_data:
