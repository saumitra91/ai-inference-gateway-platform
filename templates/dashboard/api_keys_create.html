{% extends "base.html" %}
{% block title %}Create API key · Inference Control Plane{% endblock %}
{% block content %}
  <header class="page-header">
    <h1>Create API key</h1>
    <p class="muted">
      Raw keys are shown <strong>once</strong>. The database stores only an HMAC digest with a server pepper — not the
      secret material.
    </p>
  </header>

  <section class="card" style="max-width: 640px">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn primary" type="submit">Create key</button>
    </form>
  </section>
{% endblock %}
